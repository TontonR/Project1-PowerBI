name: WuWa News Scraper Manual

on:
  # Habilita exclusivamente el botón "Run workflow" en la interfaz de GitHub
  workflow_dispatch:

jobs:
  scrape-news:
    runs-on: ubuntu-latest

    steps:
      # 1. Copia el código de tu repositorio en el servidor de Ubuntu
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configura Python en el servidor
      - name: Configurar Python
        uses: actions/setup-python@v5

      # 3. Instala solo lo necesario para el scraping básico
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # 4. Ejecuta tu archivo específico wuwa.py
      - name: Ejecutar Scraper
        run: python wuwa.py
