name: WuWa News Scraper Manual

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Esto permite activar el botón "Run workflow" manualmente desde la web

permissions:
  contents: write # PERMISO CRUCIAL: Permite al script guardar el archivo .md en tu repositorio

jobs:
  scrape-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # Ejecuta el script (este creará el archivo noticias_wuwa.md)
      - name: Ejecutar Scraper
        run: python wuwa.py

      # Detecta si el archivo .md cambió y lo sube al repositorio de forma automática
      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add noticias_wuwa.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "📝 Actualizar novedades de Wuthering Waves [Automático]" && git push)
